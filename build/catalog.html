<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Coffee House</title>
        <link rel="preload" href="./fonts/Inter_18pt-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous">
        <link rel="preload" href="./fonts/Inter_24pt-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous">
        <link rel="preload" href="./fonts/Inter_28pt-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./css/main.css" />
        <link rel="icon" type="image/x-icon" href="./img/favicon/favicon.ico">
    </head>
    <body>
        <header class="header">

        <div class="header__container container">
            <nav class="header__nav nav">
                <a class="main-nav__logo" href="index.html">
                    <h1 class="visually-hidden title">Resource coffee house</h1>
                    <picture class="main-nav__picture">
                        <source media="(max-width: 1025px)" srcset="./img/logo-coffee.png 1x, img/logo-coffee.png 2x">
                        <img class="main-nav__image" src="./img/logo-coffee.png" srcset="./img/logo-coffee.png"  alt="Resource coffee house"  width="100" height="60">
                    </picture>
                </a>
                <nav class="main-nav">
                <ul class="main-nav__list list">
                    <li class="main-nav__item">
                        <a class="main-nav__link link" href="#favorite">Favorite coffee</a>
                    </li>
                    <li class="main-nav__item">
                        <a class="main-nav__link link" href="#about">About</a>
                    </li>
                    <li class="main-nav__item">
                        <a class="main-nav__link link" href="#app">Mobile app</a>
                    </li>
                    <li class="main-nav__item">
                        <a class="main-nav__link link" href="#contact">Contact us</a>
                    </li>
                </ul>
            </nav>

            <div class="theme-btn__wrapper">
                <button class="nav-btn theme-btn light-theme-btn">
                    <svg class="theme-icon icon">
                        <use href="./img/svgsprite/sprite.symbol.svg#sun"></use>
                    </svg>
                </button>
                <button class="nav-btn theme-btn dark-theme-btn">
                    <svg class="theme-icon icon">
                        <use href="./img/svgsprite/sprite.symbol.svg#moon"></use>
                    </svg>
                </button>
            </div>
            <a class="main-nav__link menu-link link" href="catalog.html">
                <span class="menu__text">Menu</span>
                <svg class="menu-icon icon">
                    <use href="./img/svgsprite/sprite.symbol.svg#coffee-cup"></use>
                </svg>
            </a>
            <button class="mobile-nav-btn">
                <span class="nav-icon">
                    <!-- <svg class="burger-icon icon">
                        <use href="./img/svgsprite/sprite.symbol.svg#burger"></use>
                    </svg>
                    <svg class="cross-icon icon">
                        <use href="./img/svgsprite/sprite.symbol.svg#cross"></use>
                    </svg> -->
                </span>
            </button>
            </nav>

        </div>
</header>
        <main class="main main-content">

        </main>
        <footer class="footer container">
    <div class="footer__wrapper wrapper">
        <div class="footer__container container">
            <h2 class="footer__title title">Sip, Savor, Smile. It&#8217;s coffee time!</h2>
            <p>Sip, Savor, Smile. It&#8217;s coffee time!</p>
            <div class="footer__wrapper">
                <h3 class="visually-hidden">social</h3>
                <ul class="footer__social-list list">
                    <li class="footer__item">
                        <svg class="burger-icon icon">
                            <use href="./img/svgsprite/sprite.symbol.svg#twitter"></use>
                        </svg>
                        <a class="footer__link link" href="#">
                            <span>twittwer</span>
                        </a>
                    </li>
                    <li class="footer__item">
                        <svg class="burger-icon icon">
                            <use href="./img/svgsprite/sprite.symbol.svg#instagram"></use>
                        </svg>
                        <a class="footer__link link" href="#">
                            <span>instagram</span>
                        </a>
                    </li>
                    <li class="footer__item">
                        <svg class="burger-icon icon">
                            <use href="./img/svgsprite/sprite.symbol.svg#facebook"></use>
                        </svg>
                        <a class="footer__link link" href="#">
                            <span>facebook</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="footer-list__wrapper">

            <div class="footer-list__container container">
                <h3 class="footer__title title">Contact us</h3>
                <ul class="footer__social-list list">
                    <li class="footer__item">
                        <a class="footer__link link" href="#">
                            <svg class="burger-icon icon">
                                <use href="./img/svgsprite/sprite.symbol.svg#pin"></use>
                            </svg>
                            <span>8558 Green Rd., LA</span>
                        </a>
                    </li>
                    <li class="footer__item">
                        <a class="footer__link link" href="#" type="tel">
                            <svg class="burger-icon icon">
                                <use href="./img/svgsprite/sprite.symbol.svg#phone"></use>
                            </svg>
                            <span>+1 (603) 555-0123</span>
                        </a>
                    </li>
                    <li class="footer__item">
                        <a class="footer__link link" href="#">
                            <svg class="burger-icon icon">
                                <use href="./img/svgsprite/sprite.symbol.svg#clock"></use>
                            </svg>
                            <span>Mon&#8211;Sat: 9:00&#8211;23:00</span>
                        </a>
                    </li>
                </ul>

            </div>
        </div>
    </div>
</footer>

        <script src="./js/index.bundle.js"></script>
    </body>
</html>
