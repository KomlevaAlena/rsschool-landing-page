<section class="app section container" id="app">
    <div class="app__wrapper wrapper">
        <h2 class="app__title title">
            <sapn class="text-accent">Download</sapn>&nbspour app to start
            ordering
        </h2>
        <p class="app__text">
            Download the Resource app today and experience the comfort of
            ordering your favorite coffee from wherever you are
        </p>
        <ul class="app__list list">
            <li class="app__item">
                <a class="app__link btn link" href="#">
                    <svg class="burger-icon icon">
                        <use href="./img/svgsprite/sprite.symbol.svg#app"></use>
                    </svg>
                    <div class="app__btn-wrapper">
                        <span>Available on the</span>
                        <span>App Store</span>
                    </div>
                </a>
            </li>
            <li class="app__item">
                <a class="app__link btn link" href="#">
                    <svg class="burger-icon icon">
                        <use
                            href="./img/svgsprite/sprite.symbol.svg#google"
                        ></use>
                    </svg>
                    <div class="app__btn-wrapper">
                        <span>Available on the</span>
                        <span>Google Play</span>
                    </div>
                </a>
            </li>
        </ul>
    </div>
    <picture class="app__picture">
        <source
            media="(max-width: 1025px)"
            srcset="img/mobile-screens.png 1x, img/mobile-screens.png 2x"
        />
        <img
            class="app__image"
            src="img/mobile-screens.png"
            srcset="img/mobile-screens.png"
            alt="mobile"
            width="630"
            height="630"
        />
    </picture>
</section>
