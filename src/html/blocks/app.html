<section class="app section" id="app">
    <h2 class="visually-hidden title">
        Download app
    </h2>
    <div class="about__wrapper wrapper">
        <p class="about__description description">
            Download our app to start ordering
        </p>
        <p class="about__text">
            Download the Resource app today and experience the comfort of ordering your favorite coffee from wherever you are
        </p>
        <ul class="about__list list">
            <li class="about__item">
                <svg class="burger-icon icon">
                        <use href="./img/svgsprite/sprite.symbol.svg#app"></use>
                    </svg>
                <span>Available on the</span>
                <span>App Store</span>
            </li>
            <li class="about__item">
                <svg class="burger-icon icon">
                        <use href="./img/svgsprite/sprite.symbol.svg#google"></use>
                    </svg>
                <span>Available on the</span>
                <span>Google Play</span>
            </li>
        </ul>
    </div>
    <picture class="hero__picture">
            <source media="(max-width: 1025px)" srcset="img/mobile-screens.png 1x, img/mobile-screens.png 2x">
            <img class="hero__image" src="img/mobile-screens.png" srcset="img/mobile-screens.png"  alt="mobile"  width="630" height="630">
        </picture>
    
</section>
